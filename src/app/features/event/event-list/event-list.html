<div class="container">
  <button routerLink="/events/add">add new</button>
  <div class="row">
    <div class="col-sm-8">
      @for (event of events(); track event.id) {
      <app-card  [ev]="event" (incrementLikes)="incrementerLikes($event)" ></app-card>
      } @empty {
        <p>No events available.</p>
      }
    </div>
  </div>
</div>
